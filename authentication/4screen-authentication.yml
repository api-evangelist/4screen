    surface: https://portal.4screen.com
    note: >-
      Public browser client for the 4.screen customer portal, named in the
      portal's own config.js. Its presence confirms authorization_code is the
      interactive flow; the partner/OEM integration path is client_credentials.

observations:
  - >-
    Notable weakness in the published posture: the realm still advertises the
    `implicit` and `password` (Resource Owner Password Credentials) grant types,
    both of which OAuth 2.0 Security BCP (RFC 9700) says MUST NOT be used. This
    is Keycloak's default surface rather than a deliberate 4.screen choice, but
    it is what the discovery document tells a client.
  - >-
    Notable strength: mutual-TLS client authentication and certificate-bound
    access tokens (RFC 8705) are both advertised, as are Pushed Authorization
    Requests (RFC 9126) and private_key_jwt — an unusually complete set for a
    company of this size, and the pieces a FAPI-grade integration needs.
  - >-
    require_pushed_authorization_requests is false, so PAR is available but not
    enforced.

gaps:
  - >-
    No published API reference, so which scope or role each endpoint requires is
    not documented anywhere public. The scope NAMES are known (see
    scopes/4screen-scopes.yml) but their operation mapping is not.
  - >-
    No documented API-key alternative for server-to-server callers; every
    integration goes through the OAuth token endpoint.
