docs: null
name: 4.screen API authentication
description: >-
  Every 4.screen API surface is protected. The whole of api.4screen.com answers
  HTTP 401 with a {"httpStatus":401,"domain":"SYSTEM","errorCode":"AUTHENTICATION_FAILED"}
  envelope for anonymous callers. Authentication is OpenID Connect / OAuth 2.0
  against a self-hosted Keycloak realm mounted under /auth on the same host, and
  that realm's discovery document IS served anonymously — so the auth contract
  is public even though the API contract is not.

x-evidence:
  fetched: '2026-09-05'
  discovery_url: https://api.4screen.com/auth/realms/fourscreen/.well-known/openid-configuration
  discovery_status: 200
  discovery_content_type: application/json;charset=UTF-8
  saved_verbatim: well-known/4screen-openid-configuration.json
  anonymous_api_probe:
    url: https://api.4screen.com/
    status: 401
    body: '{"httpStatus":401,"domain":"SYSTEM","errorCode":"AUTHENTICATION_FAILED","message":"Full authentication is required to access this resource"}'
  discovered_via: >-
    https://portal.4screen.com/config.js (HTTP 200) publishes
    window.AUTH_URL = 'https://api.4screen.com/auth' and
    window.AUTH_REALM = 'fourscreen', which is what located the realm path.

provider:
  identity_provider: Keycloak
  self_hosted: true
  issuer: https://api.4screen.com/auth/realms/fourscreen
  realm: fourscreen
  note: >-
    Keycloak is 4.screen's own deployment on their own API host, not a
    third-party IDaaS tenant. The public_key and realm metadata are readable at
    https://api.4screen.com/auth/realms/fourscreen (HTTP 200).

schemes:
  - id: openIdConnect
    type: openIdConnect
    openIdConnectUrl: https://api.4screen.com/auth/realms/fourscreen/.well-known/openid-configuration
    description: >-
      Full OIDC discovery is published. Clients obtain a bearer JWT from the
      Keycloak token endpoint and present it to api.4screen.com.
    in: header
    header: Authorization
    format: 'Bearer <JWT>'
  - id: oauth2
    type: oauth2
    description: >-
      OAuth 2.0 flows advertised by the realm. client_credentials is the
      server-to-server mode a partner integration would use; authorization_code
      with PKCE (S256 advertised) is what the browser portal uses.
    flows:
      clientCredentials:
        tokenUrl: https://api.4screen.com/auth/realms/fourscreen/protocol/openid-connect/token
      authorizationCode:
        authorizationUrl: https://api.4screen.com/auth/realms/fourscreen/protocol/openid-connect/auth
        tokenUrl: https://api.4screen.com/auth/realms/fourscreen/protocol/openid-connect/token
        refreshUrl: https://api.4screen.com/auth/realms/fourscreen/protocol/openid-connect/token
      deviceCode:
        deviceAuthorizationUrl: https://api.4screen.com/auth/realms/fourscreen/protocol/openid-connect/auth/device

