aid: 4screen
name: 4.screen
description: >-
  4.screen GmbH (Munich, Germany) operates the Driver Interaction Platform — a
  two-sided in-car marketplace connecting businesses with drivers in real time
  through the vehicle's built-in navigation and infotainment screen. Its
  Mobility Experience Cloud (MXC) connects by API to automaker vehicle backends,
  and brands buy four placement formats through it: Branded Pins (a logo on the
  in-car map at a business location), Sponsored Search (paid ranking in in-car
  navigation results), Recommendations (context-aware offers driven by vehicle
  signals) and Detail Screen (an interactive promotion with engagement
  tracking). OEM partners include Audi, Volkswagen, Skoda, Nissan, Hyundai, Kia
  and the Stellantis brands; advertisers include McDonald's, Shell, KFC,
  Waitrose, Kaufland and Coop. The API is real and central to the product, but
  entirely gated: api.4screen.com answers HTTP 401 on every path, and there is
  no public developer portal, reference or specification.
