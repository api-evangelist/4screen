x-coverage:
  state: gated
  reason: sales-gate
  detail: >-
    4.screen's API is real and central to the product — its own FAQ says
    automakers "can implement the 4screen API into their infotainment systems
    ... easily within days" — but api.4screen.com answers HTTP 401
    AUTHENTICATION_FAILED on every path including /openapi.json, /v3/api-docs
    and /graphql, docs.4screen.com and developer.4screen.com do not resolve in
    DNS, and both the OEM page and the advertiser page replace a reference with
    a "Book an OEM Partnership Meeting" form. The only machine-readable contract
    4.screen publishes anonymously is its Keycloak OIDC/OAuth discovery document.
  evidence:
    - url: https://api.4screen.com/v3/api-docs
      status: 401
    - url: https://api.4screen.com/openapi.json
      status: 401
    - url: https://api.4screen.com/graphql
      status: 401
    - url: https://4screen.com/4-automotives/
      status: 200
    - url: https://api.4screen.com/auth/realms/fourscreen/.well-known/openid-configuration
      status: 200
  checked: '2026-09-05'
