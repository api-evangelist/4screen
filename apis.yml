apis:
- aid: 4screen:mobility-experience-cloud
  name: 4.screen Mobility Experience Cloud API
  description: >-
    The production 4.screen API. Automakers and mobility service providers
    integrate it into infotainment and navigation systems to render 4.screen
    content in the vehicle, and the 4.screen customer portal calls the same host
    for campaign management. The surface is OAuth 2.0 / OpenID Connect protected
    by a self-hosted Keycloak realm mounted at /auth on the same host, and a
    GraphQL endpoint is referenced by the portal application at /graphql. No
    OpenAPI, GraphQL SDL or public reference is published — every anonymous
    request to api.4screen.com returns HTTP 401 AUTHENTICATION_FAILED.
  humanURL: https://4screen.com/4-automotives/
