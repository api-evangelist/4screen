name: 4.screen well-known discovery documents
description: >-
  4.screen serves an RFC 9116 security.txt from three separate hosts and a full
  anonymous OpenID Connect / OAuth 2.0 Authorization Server Metadata document
  from its Keycloak realm. Every other API path on api.4screen.com — including
  the root well-known paths, /graphql and every springdoc/swagger location — is
  answered with an HTTP 401 AUTHENTICATION_FAILED envelope, so the discovery
  documents below are the only machine-readable contract 4.screen publishes
  without credentials.

